# Host Nginx for the DOCKER deployment path -- the one this platform
# actually runs on. Terminates HTTPS and reverse-proxies to the frontend
# container on 127.0.0.1:8080.
#
# This file exists because it was MISSING. deploy/nginx-vps.conf is for
# the bare-metal path and says so in its first line, so nothing in git
# described the config actually serving portal.skybre.co.za -- while
# SECURITY_AND_REDUNDANCY.md names "clone the repo and docker compose up"
# as the disaster-recovery procedure. A rebuild from git produced a
# platform with no HTTPS and no way to reach it, and the only copy of the
# real config was on the box being rebuilt.
#
# IMPORTANT: this is a reference derived from DEPLOYMENT.md's snippet plus
# the gaps an audit found in it. It is NOT a capture of the live file.
# Reconcile it against what is actually running before trusting it:
#
#     sudo diff -u deploy/nginx-host-docker.conf /etc/nginx/sites-available/isp-platform
#
# and commit the differences, so the next person to rebuild gets the real
# thing rather than this approximation.
#
# Install:
#     sudo cp deploy/nginx-host-docker.conf /etc/nginx/sites-available/isp-platform
#     sudo ln -sf /etc/nginx/sites-available/isp-platform /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#     sudo certbot --nginx -d portal.skybre.co.za
#
# Certbot rewrites this file in place: it adds the listen 443 block, the
# certificate paths, and the HTTP->HTTPS redirect, and sets up renewal.
# Everything below is written to survive that rewrite.

server {
    listen 80;
    listen [::]:80;
    server_name portal.skybre.co.za;

    # ---- request size -------------------------------------------------
    # The OUTERMOST hop decides. DEPLOYMENT.md's snippet omitted this, so
    # nginx's 1 MB default applied here -- and a scanned A4 supplier
    # invoice is routinely 2-6 MB. The request was refused with a bare 413
    # at this hop and never reached the frontend container, which
    # carefully allows 20 MB, or Django, which would have answered with a
    # styled message saying what the limit is. Kept in step with
    # frontend/nginx.conf; both are deliberately looser than the app's own
    # 15 MB (config/uploads.py) so Django is always the one that answers.
    client_max_body_size 20m;

    # ---- security headers ---------------------------------------------
    # There were none, anywhere. index.html is served by nginx and never
    # passes through Django's SecurityMiddleware, so Django's
    # X_FRAME_OPTIONS never applied to the app shell -- the staff panel
    # and its login page were framable. Certbot does not add HSTS either.
    #
    # always: so they are present on error responses too, which is where
    # a framing or sniffing attack is most likely to land.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Content-Security-Policy. The SPA bundles everything from its own
    # lockfile and loads no third-party script, font or stylesheet -- a
    # frontend audit confirmed there are no CDN references at all -- so a
    # strict policy costs nothing here.
    #
    # 'unsafe-inline' on style-src only: Tailwind's build emits inline
    # style attributes. script-src has no such exception on purpose --
    # that is the directive that would have blunted the stored-XSS finding
    # in the email-template preview if it had existed then.
    #
    # blob: on frame-src because the PDF preview renders into an object
    # URL; connect-src 'self' covers the API, which is same-origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # HSTS. Uncomment ONLY once certbot has run and https is confirmed
    # working, and understand that browsers remember it: a wrong value
    # here locks visitors out of the domain over http for max-age
    # seconds. Django can also send this (SECURE_HSTS_SECONDS) -- set it
    # in one place, not both.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- Django's admin: not for the internet -------------------------
    # Django's own admin is at /django-admin/ (NOT /admin/, which is the
    # React staff panel's client-side route tree). It was proxied to the
    # internet with no restriction, and it is a second login path that the
    # app's 2FA does not cover: the TOTP check lives in the DRF token
    # serializer, while the admin uses session auth via ModelBackend and
    # knows nothing about it. Every staff role is provisioned is_staff=True,
    # which is the flag the admin site checks -- so a stolen password was
    # enough, 2FA or not.
    #
    # Replace the allow lines with the addresses you actually administer
    # from. An SSH tunnel is stricter still and needs no allow list:
    #     ssh -L 8000:127.0.0.1:8000 ubuntu@<vps>   # then http://localhost:8000/django-admin/
    # in which case delete this whole block.
    location /django-admin/ {
        # allow 197.0.0.0/8;      # office range -- REPLACE
        allow 127.0.0.1;
        deny all;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- the container healthcheck's endpoint is internal only --------
    # Docker polls this from inside the container. Nothing outside needs
    # it, and it is unauthenticated by necessity.
    location = /api/health/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # ---- everything else ----------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # APPEND, never replace. The container's nginx appends again, so
        # the backend sees "client, host-nginx" and Django's own docs on
        # this chain hold. audit/middleware.py takes the leftmost entry
        # and now validates it as an IP; accounts/login_guard.py
        # deliberately does NOT rate-limit on it, because a client can put
        # anything in the first position.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # $scheme, not a literal: certbot's rewrite gives this block http
        # and the 443 block https, and the app derives absolute URLs and
        # its SSL-redirect decision from this. Hardcoding https here while
        # this block still listens on 80 is what produced the redirect
        # loop documented in SECURITY_AND_REDUNDANCY.md.
        proxy_set_header X-Forwarded-Proto $scheme;

        # A PDF render or a RouterOS call can take a few seconds; the
        # default 60s is fine, but a bank-feed sync or a billing run
        # started from the browser can exceed it.
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}

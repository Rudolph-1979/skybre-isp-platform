# Example host Nginx config for the BARE-METAL deployment path (no Docker).
# Copy to /etc/nginx/sites-available/isp-platform, symlink into sites-enabled,
# then run certbot (see DEPLOYMENT.md) to fill in the SSL lines automatically.
#
#   sudo cp deploy/nginx-vps.conf /etc/nginx/sites-available/isp-platform
#   sudo ln -s /etc/nginx/sites-available/isp-platform /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Built frontend (`npm run build` output copied here — see DEPLOYMENT.md)
    root /opt/isp-platform/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8000/static/;
    }

    client_max_body_size 20M;
}

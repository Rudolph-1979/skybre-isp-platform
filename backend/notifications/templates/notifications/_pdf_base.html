<html>
<head>
<style>
  @page { size: A4; margin: 2cm; }
  body { font-family: Helvetica, Arial, sans-serif; font-size: 10pt; color: #1a1a1a; }
  .brand { font-size: 20pt; font-weight: bold; color: #1d4ed8; }
  .tagline { font-size: 8pt; color: #666666; margin-top: -4px; }
  .doc-title { font-size: 16pt; font-weight: bold; margin-top: 18px; }
  .meta-table td { padding: 2px 0; }
  .meta-label { color: #666666; padding-right: 10px; }
  .addr-block { margin-top: 14px; margin-bottom: 14px; }
  .addr-label { color: #666666; font-size: 8pt; text-transform: uppercase; }
  table.items { width: 100%; border-collapse: collapse; margin-top: 10px; }
  table.items th { background-color: #f0f2f5; text-align: left; padding: 6px 8px; font-size: 9pt; border-bottom: 1px solid #cccccc; }
  table.items td { padding: 6px 8px; border-bottom: 1px solid #e5e7eb; font-size: 9.5pt; }
  .num { text-align: right; }
  .totals-table { width: 260px; margin-left: auto; margin-top: 10px; }
  .totals-table td { padding: 3px 8px; }
  .totals-table .grand { font-weight: bold; font-size: 11pt; border-top: 1px solid #333333; }
  .balance-due { font-weight: bold; color: #b91c1c; }
  .footer-note { margin-top: 24px; font-size: 8pt; color: #888888; }
  .proforma-note { font-size: 8.5pt; color: #a5730a; font-style: italic; margin-top: 2px; }
</style>
</head>
<body>
  <div class="brand">{{ company_name }}</div>
  <div class="tagline">Internet Service Provider</div>
  {% block content %}{% endblock %}
  <p class="footer-note">Generated by {{ company_name }} on {{ generated_date }}.</p>
</body>
</html>

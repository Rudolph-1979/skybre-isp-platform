services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      TZ: Africa/Johannesburg
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      TZ: Africa/Johannesburg
      # Editing a RADIUS client in the admin panel writes clients.conf here;
      # a systemd path unit on the host validates it and reloads FreeRADIUS.
      # See radiusauth/clients_conf.py and install-radius-clients-sync.sh.
      RADIUS_CLIENTS_SPOOL: /srv/radius/clients.conf
    volumes:
      - media_data:/app/media
      # Host-mounted spool. FreeRADIUS runs on the host (it owns UDP
      # 1812/1813 and reads /etc/freeradius), so this file is the handoff
      # point -- the container writes, the host installs. Deliberately a
      # narrow bind mount rather than giving the container the docker socket
      # or host systemd access.
      - /var/lib/skybre/radius:/srv/radius
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      TZ: Africa/Johannesburg
    depends_on:
      - backend
    ports:
      # Bound to localhost only — a host-level Nginx (installed outside
      # Docker) now owns the public 80/443 and terminates HTTPS via
      # Certbot, reverse-proxying to this container. See DEPLOYMENT.md
      # Option A step 6 and PROJECT_STATUS.md.
      - "127.0.0.1:8080:80"

volumes:
  postgres_data:
  media_data:

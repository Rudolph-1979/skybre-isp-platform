services:
  db:
    image: postgres:16-alpine
    ports:
      # Bound to localhost only. FreeRADIUS runs on the HOST (it owns UDP
      # 1812/1813 and reads /etc/freeradius), so it cannot reach Postgres
      # over the compose network -- this mapping is the only path it has.
      #
      # Do not remove it. Shipping a compose file without this line is
      # what took RADIUS down on 2026-08-2x: the platform stayed up, so
      # nothing looked wrong, while every customer authentication failed.
      #
      # And do not widen it to "5432:5432" either, which is the obvious
      # edit and binds 0.0.0.0. Docker publishes ports by DNAT in the nat
      # table's DOCKER chain, which never traverses the INPUT chain where
      # ufw's default-deny lives -- so `ufw status` showing 22/80/443 only
      # says nothing about a published container port. This database holds
      # every subscriber's internet password in plaintext
      # (radiusauth.signals writes Cleartext-Password rows), every router's
      # admin credentials, and all billing and bank-feed data, so the
      # 127.0.0.1 prefix is the whole of what keeps it off the internet.
      #
      # Same pattern the frontend service uses below, for the same reason.
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      TZ: Africa/Johannesburg
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ispplatform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      TZ: Africa/Johannesburg
      # Editing a RADIUS client in the admin panel writes clients.conf here;
      # a systemd path unit on the host validates it and reloads FreeRADIUS.
      # See radiusauth/clients_conf.py and install-radius-clients-sync.sh.
      RADIUS_CLIENTS_SPOOL: /srv/radius/clients.conf
    volumes:
      - media_data:/app/media
      # Host-mounted spool. FreeRADIUS runs on the host (it owns UDP
      # 1812/1813 and reads /etc/freeradius), so this file is the handoff
      # point -- the container writes, the host installs. Deliberately a
      # narrow bind mount rather than giving the container the docker socket
      # or host systemd access.
      - /var/lib/skybre/radius:/srv/radius
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      # curl is already in the image (see Dockerfile). Without this the
      # frontend starts accepting traffic while gunicorn is still migrating,
      # which is 502s on every deploy -- and a wedged worker is never
      # restarted, because nothing is checking.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      TZ: Africa/Johannesburg
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Bound to localhost only — a host-level Nginx (installed outside
      # Docker) now owns the public 80/443 and terminates HTTPS via
      # Certbot, reverse-proxying to this container. See DEPLOYMENT.md
      # Option A step 6 and PROJECT_STATUS.md.
      - "127.0.0.1:8080:80"

volumes:
  postgres_data:
  media_data:

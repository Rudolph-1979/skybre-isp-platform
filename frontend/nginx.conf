server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router -- always fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the Django backend container.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Django's OWN admin site lives at /django-admin/, not /admin/ --
    # /admin/ is the React app's entire staff panel (a client-side route
    # tree: /admin/customers, /admin/invoices, etc.) and deliberately has
    # NO location block here, so it falls through to the SPA fallback
    # above (location /) on a hard refresh, same as every other React
    # route, instead of being proxied to Django.
    location /django-admin/ {
        proxy_pass http://backend:8000/django-admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /static/ {
        proxy_pass http://backend:8000/static/;
    }

    # Signed, short-lived download links (see backend/config/media_security.py)
    # -- forwarded to Django the same way /api/ and /admin/ are, using the
    # already-fixed X-Forwarded-Proto header so this doesn't hit the same
    # SSL-redirect-loop bug those did.
    location /media/ {
        proxy_pass http://backend:8000/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

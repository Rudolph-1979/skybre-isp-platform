# Skybre Tower Network - Inventory
# =================================
# Define all towers here. The hub is the VPS/control center.
# Spokes are the MikroTik tower routers.

hub:
  name: "VPS-Control"
  public_ip: "154.65.111.61"
  wg_port: 51820
  wg_address: "10.10.0.1/24"
  snmp_community: "skybre"
  snmp_version: "2c"
  api_host: "154.65.111.61"
  api_port: 8728
  api_user: "skybre-api"
  # api_password loaded from env or secrets
  model: "VPS"
  location: "Xneelo Cloud"

spokes:
  - name: "Teraco-JHB"
    public_ip: "SET_PUBLIC_IP"
    wg_port: 51820
    wg_address: "10.10.0.10/24"
    snmp_community: "skybre"
    snmp_version: "2c"
    api_host: "SET_PUBLIC_IP"
    api_port: 8728
    api_user: "skybre-api"
    model: "RB1100AHx4"
    location: "Teraco Johannesburg"
    tier: 1

  - name: "Cloudflare-Edge"
    public_ip: "SET_PUBLIC_IP"
    wg_port: 51820
    wg_address: "10.10.0.11/24"
    snmp_community: "skybre"
    snmp_version: "2c"
    api_host: "SET_PUBLIC_IP"
    api_port: 8728
    api_user: "skybre-api"
    model: "RB4011iGS+"
    location: "Cloudflare Edge"
    tier: 1

  # Add more towers below:
  # - name: "Tower-Name"

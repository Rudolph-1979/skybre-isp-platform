vpn:
  # WireGuard settings
  mtu: 1420
  keepalive: 25
  dns: "1.1.1.1, 1.0.0.1"
  # Allowed subnet for the entire VPN mesh
  network: "10.10.0.0/24"

monitoring:
  # SNMP polling interval in seconds
  poll_interval: 30
  # Dashboard refresh rate
  refresh_rate: 5
  # Alert thresholds
  cpu_warn: 70
  cpu_crit: 90
  voltage_warn: 10.5
  voltage_crit: 10.0
  uptime_warn_hours: 24
